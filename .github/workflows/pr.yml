name: PR
run-name: Nautilus PR for ${{ github.actor }}
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
# cancel previous runs of same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ${{matrix.os}}
    name: ${{ matrix.os }} ${{ matrix.cc }} ${{ matrix.flags }}
    # Backstop against a hung test: a single ctest case hanging on macos-26
    # once ran for ~6h before hitting GitHub's default 360m job timeout. The
    # per-test `ctest --timeout` below should catch this first; this is the
    # second line of defense.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-24.04'
            cc: 'gcc-14'
            cxx: 'g++-14'
            flags: ''
          - os: 'ubuntu-24.04'
            cc: 'gcc-14'
            cxx: 'g++-14'
            flags: '-DENABLE_TRACING=OFF -DENABLE_LOGGING=OFF'
          - os: 'ubuntu-24.04'
            cc: 'clang-19'
            cxx: 'clang++-19'
            flags: ''
          - os: 'ubuntu-24.04'
            cc: 'clang-21'
            cxx: 'clang++-21'
            flags: ''
          - os: 'ubuntu-24.04'
            cc: 'clang-21'
            cxx: 'clang++-21'
            flags: '-DENABLE_SHORT_CIRCUIT_BOOL=ON'
          - os: 'ubuntu-24.04'
            cc: 'clang-21'
            cxx: 'clang++-21'
            flags: '-DENABLE_GPU_PLUGIN=ON'
          # The iOS-safe closure path: bc and tbc hand out native function
          # pointers via libffi static trampolines instead of dyncall callbacks,
          # so no runtime-executable memory is allocated. Built nowhere else, so
          # without this leg the configuration silently rots.
          - os: 'ubuntu-24.04'
            cc: 'clang-21'
            cxx: 'clang++-21'
            flags: '-DENABLE_FFI_CLOSURES=ON'
          - os: 'macos-26'
            cc: 'clang'
            cxx: 'clang++'
            flags: '-DENABLE_GPU_PLUGIN=ON'
          - os: 'ubuntu-24.04'
            cc: 'gcc-14'
            cxx: 'g++-14'
            flags: '-DENABLE_ADDRESS_SANITIZER=ON'
          - os: 'ubuntu-24.04'
            cc: 'clang-21'
            cxx: 'clang++-21'
            flags: '-DENABLE_ADDRESS_SANITIZER=ON'
          - os: 'ubuntu-24.04-arm'
            cc: 'clang-21'
            cxx: 'clang++-21'
            flags: '-DENABLE_GPU_PLUGIN=ON'
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Force apt to use IPv4
        if: startsWith(matrix.os, 'ubuntu')
        run: echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
      - name: Install libffi
        if: startsWith(matrix.os, 'ubuntu') && contains(matrix.flags, 'ENABLE_FFI_CLOSURES=ON')
        run: sudo apt-get update && sudo apt-get install -y libffi-dev
      - name: get cmake
        uses: lukka/get-cmake@latest
      - name: Cache MLIR binaries
        uses: actions/cache@v4
        with:
          path: build/mlir-*
          key: mlir-22.1.8-${{ runner.os }}-${{ runner.arch }}
      - name: get ccache
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          key: ${{ github.job }}-${{ matrix.os }}-${{ matrix.cc }}-${{ hashFiles('**/CMakeLists.txt') }}
      - name: Derive clang version
        if: startsWith(matrix.cc, 'clang-') && startsWith(matrix.os, 'ubuntu')
        run: echo "CC_VERSION=$(echo '${{ matrix.cc }}' | sed 's/clang-//')" >> "$GITHUB_ENV"
      - name: Install clang + LLVM
        if: startsWith(matrix.cc, 'clang-') && startsWith(matrix.os, 'ubuntu')
        uses: ./.github/actions/install-llvm
        with:
          llvm-version: ${{ env.CC_VERSION }}
      - name: cmake
        shell: bash
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.flags }}  -G Ninja -S . -B build
      - name: build
        shell: bash
        run: |
          cmake --build build --target all
      - name: test
        shell: bash
        run: |
          ctest --test-dir build/nautilus --output-on-failure --timeout 300
      - name: test std plugin
        shell: bash
        run: |
          ctest --test-dir build/plugins/std/test --output-on-failure --timeout 300
      - name: test simd plugin
        shell: bash
        run: |
          ctest --test-dir build/plugins/simd/test --output-on-failure --timeout 300
      - name: test inlining plugin
        if: startsWith(matrix.cc, 'clang-19') || startsWith(matrix.cc, 'clang-20') || startsWith(matrix.cc, 'clang-21')
        shell: bash
        run: |
          ctest --test-dir build/plugins/inlining/test --output-on-failure --timeout 300
      - name: test gpu plugin
        if: contains(matrix.flags, 'ENABLE_GPU_PLUGIN=ON')
        shell: bash
        run: |
          ctest --test-dir build/plugins/gpu/test --output-on-failure --timeout 300
  example-demos:
    runs-on: ubuntu-24.04
    name: Example demos (clang-18)
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Force apt to use IPv4
        run: echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
      - name: get cmake
        uses: lukka/get-cmake@latest
      - name: Cache MLIR binaries
        uses: actions/cache@v4
        with:
          path: example/build/mlir-*
          key: mlir-22.1.8-${{ runner.os }}-${{ runner.arch }}-example
      - name: get ccache
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          key: ${{ github.job }}-example-demos
      - name: cmake
        shell: bash
        working-directory: example
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -G Ninja -S . -B build
      - name: build demos
        shell: bash
        working-directory: example
        run: |
          cmake --build build --target demo demo_modules demo_backends demo_runtime_calls demo_regions demo_std_plugin demo_simd_plugin demo_specialization_plugin
      - name: run demo (baseline conditionalSum)
        shell: bash
        working-directory: example/build
        run: |
          out=$(./demo)
          echo "$out"
          echo "$out" | grep -q "Result: 7"
      - name: run demo_modules
        shell: bash
        working-directory: example/build
        run: |
          out=$(./demo_modules)
          echo "$out"
          echo "$out" | grep -q "add(3, 4)      = 7"
          echo "$out" | grep -q "mul(3, 4)      = 12"
          echo "$out" | grep -q "factorial(5)   = 120"
          echo "$out" | grep -q "factorial(10)  = 3628800"
      - name: run demo_regions
        shell: bash
        working-directory: example/build
        run: |
          out=$(./demo_regions)
          echo "$out"
          echo "$out" | grep -q "summarize(threshold=8) = 6503"
          # the three nested regions, each named at the call site that opened it --
          # "accumulate" through the stage() helper, which is the point of that overload
          echo "$out" | grep -q 'region "scan" at .*DemoRegions.cpp:'
          echo "$out" | grep -q 'region "classify" at .*DemoRegions.cpp:'
          echo "$out" | grep -q 'region #2 "accumulate" at .*DemoRegions.cpp:'
          echo "$out" | grep -q 'nested in region #1 "classify" at .*DemoRegions.cpp:'

      - name: run demo_backends
        shell: bash
        working-directory: example/build
        run: |
          out=$(./demo_backends)
          echo "$out"
          echo "$out" | grep -q "result=333283335000"
      - name: run demo_runtime_calls
        shell: bash
        working-directory: example/build
        run: |
          out=$(./demo_runtime_calls)
          echo "$out"
          echo "$out" | grep -q "sumOfPrimesBelow(20)        = 77"
          echo "$out" | grep -q "quadrupleIt(5)              = 20"
          echo "$out" | grep -q "factorial(10)               = 3628800"
          echo "$out" | grep -q "applyDoubleFromRuntime(3)   = 12"
      - name: run demo_std_plugin
        shell: bash
        working-directory: example/build
        run: |
          out=$(./demo_std_plugin)
          echo "$out"
          echo "$out" | grep -qF "conditionalSumVec([1,2,3,4], [1,1,0,1]) = 7"
          echo "$out" | grep -qF "rmsError(...)                            = 0.5"
      - name: run demo_simd_plugin
        shell: bash
        working-directory: example/build
        run: |
          out=$(./demo_simd_plugin)
          echo "$out"
          echo "$out" | grep -qF "mask=[1,1,0,1]) = 7"
          echo "$out" | grep -qF "evens in [0,32)) = 240"
      - name: run demo_specialization_plugin
        shell: bash
        working-directory: example/build
        run: |
          out=$(./demo_specialization_plugin)
          echo "$out"
          echo "$out" | grep -q "conditionalSumPlain  = 7"
          echo "$out" | grep -q "conditionalSumHinted = 7"
  fuzz-replay-smoke:
    runs-on: ubuntu-24.04
    name: Fuzzer replay smoke corpus (clang-21)
    env:
      CC: clang-21
      CXX: clang++-21
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Force apt to use IPv4
        run: echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
      - name: get cmake
        uses: lukka/get-cmake@latest
      - name: Cache MLIR binaries
        uses: actions/cache@v4
        with:
          path: build/mlir-*
          key: mlir-22.1.8-${{ runner.os }}-${{ runner.arch }}
      - name: get ccache
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          key: ${{ github.job }}-fuzz-replay-smoke
      - name: Install clang + LLVM 21
        uses: ./.github/actions/install-llvm
        with:
          llvm-version: "21"
      - name: cmake
        shell: bash
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DENABLE_FUZZER_REPLAY=ON -G Ninja -S . -B build
      - name: build
        shell: bash
        run: |
          cmake --build build --target nautilus-fuzz-replay
      - name: run deterministic smoke corpus
        shell: bash
        run: |
          # Bounded, deterministic regression gate: no libFuzzer, no
          # nondeterminism, fixed iteration count. Aborts with a full
          # `Finding` report on the first genuine backend disagreement (see
          # nautilus/test/fuzz/README.md "Known findings" / "Build & run").
          # A larger, coverage-guided sweep runs weekly (fuzz-weekly.yml).
          ./build/nautilus/test/fuzz/nautilus-fuzz-replay
  llvm-ir-test:
    runs-on: ubuntu-24.04
    name: LLVM IR Test (clang-22)
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Force apt to use IPv4
        run: echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
      - name: get cmake
        uses: lukka/get-cmake@latest
      - name: get ccache
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          key: ${{ github.job }}-llvm-ir-test
      - name: Install clang + LLVM 22
        uses: ./.github/actions/install-llvm
        with:
          llvm-version: "22"
      - name: Expose llvm-diff-22 under the fallback name
        run: |
          # llvm-diff-22 matches the LLVM 22 IR the bundled MLIR (22.1.8) emits,
          # which llvm-diff-21 cannot parse. Also expose it under the older name
          # the test utility probes as a fallback.
          sudo ln -sf /usr/bin/llvm-diff-22 /usr/local/bin/llvm-diff-19
      - name: Cache MLIR binaries
        uses: actions/cache@v4
        with:
          path: build/mlir-*
          key: mlir-22.1.8-${{ runner.os }}-${{ runner.arch }}
      - name: cmake
        shell: bash
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DENABLE_LLVM_IR_TEST=ON -G Ninja -S . -B build
      - name: build
        shell: bash
        run: |
          cmake --build build --target nautilus-llvm-ir-test nautilus-std-llvm-ir-test nautilus-simd-llvm-ir-test nautilus-inlining-llvm-ir-test
      - name: test LLVM IR suites
        shell: bash
        run: |
          status=0
          ctest --test-dir build/nautilus/test/llvm-ir-test --output-on-failure || status=1
          ctest --test-dir build/plugins/std/test -L "llvm" --output-on-failure || status=1
          ctest --test-dir build/plugins/simd/test -L "llvm" --output-on-failure || status=1
          ctest --test-dir build/plugins/inlining/test -L "llvm" --output-on-failure || status=1
          exit $status
      - name: upload mismatched LLVM IR
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-ir-mismatches
          path: /tmp/nautilus-llvm-ir-mismatches
          if-no-files-found: ignore
