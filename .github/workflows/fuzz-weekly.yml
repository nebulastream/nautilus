name: Weekly fuzz
run-name: Weekly Nautilus fuzz sweep
on:
  schedule:
    # Every Monday at 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      max_total_time:
        description: 'Fuzzing budget per build variant, in seconds'
        required: false
        default: '7200'
# Only one weekly sweep at a time; never cancel one that's already running.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    name: Coverage-guided fuzz (clang-21, ${{ matrix.variant }})
    # Build (~30-60 min cold) + fuzzing budget + corpus merge and triage.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # Plain build: fastest, so the most inputs per hour; finds the
          # miscompiles (mismatches) this fuzzer exists for.
          - variant: plain
            cmake-flags: ''
          # Memory errors in the tracer, IR passes and backends that a
          # differential check alone cannot see.
          - variant: asan
            cmake-flags: '-DENABLE_ADDRESS_SANITIZER=ON'
          - variant: ubsan
            cmake-flags: '-DENABLE_UB_SANITIZER=ON'
    env:
      CC: clang-21
      CXX: clang++-21
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Force apt to use IPv4
        run: echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
      - name: get cmake
        uses: lukka/get-cmake@latest
      - name: Cache MLIR binaries
        uses: actions/cache@v4
        with:
          path: build/mlir-*
          key: mlir-22.1.8-${{ runner.os }}-${{ runner.arch }}
      - name: get ccache
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          key: ${{ github.job }}-fuzz-weekly-${{ matrix.variant }}
      - name: Install clang + LLVM 21
        uses: ./.github/actions/install-llvm
        with:
          llvm-version: "21"
      # The corpus is build-independent, so every variant seeds from the most
      # recently saved one, whichever variant saved it.
      - name: Restore fuzzing corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz-corpus-cache
          key: fuzz-corpus-${{ github.run_id }}-${{ matrix.variant }}
          restore-keys: fuzz-corpus-
      - name: cmake
        shell: bash
        run: |
          # RelWithDebInfo: symbolized stack traces in sanitizer and libFuzzer
          # crash reports.
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_FUZZING=ON ${{ matrix.cmake-flags }} -G Ninja -S . -B build
      - name: build
        shell: bash
        run: |
          cmake --build build --target nautilus-fuzz nautilus-nir-fuzz
      - name: Fuzz, then triage findings
        id: fuzz
        shell: bash
        env:
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '7200' }}
        run: |
          set +e
          ./nautilus/test/fuzz/run-fuzz.sh \
            --fuzzer build/nautilus/test/fuzz/nautilus-fuzz \
            --work fuzz-work \
            --time "${MAX_TOTAL_TIME}" \
            --jobs "$(nproc)" \
            --corpus fuzz-corpus-cache
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [[ -f fuzz-work/summary.md ]]; then
            { echo "## ${{ matrix.variant }}"; cat fuzz-work/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
          # 2 = the session itself could not run (setup error or a failed
          # crash-pipeline canary): fail here, nothing downstream is valid.
          [[ "${status}" -ne 2 ]]
      - name: Fuzz the NIR image loader, verifier and parser
        shell: bash
        run: |
          # A bounded libFuzzer session on the format readers (docs/plans/nautilus-0.4, M1.6), seeded with the
          # golden images and the .nir corpus. It does not use the differential fuzzer's triage pipeline: a crash
          # fails the job and leaves its input in fuzz-work/nir-findings.
          mkdir -p fuzz-work/nir-corpus fuzz-work/nir-findings
          cp nautilus/test/fuzz/corpus-nir/* fuzz-work/nir-corpus/
          ./build/nautilus/test/fuzz/nautilus-nir-fuzz -max_total_time=900 -print_final_stats=1 \
            -artifact_prefix=fuzz-work/nir-findings/ fuzz-work/nir-corpus
      - name: Upload NIR fuzz findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-weekly-nir-findings-${{ matrix.variant }}-${{ github.run_id }}
          path: fuzz-work/nir-findings
          if-no-files-found: ignore
          retention-days: 90
      - name: Prepare corpus for caching
        if: steps.fuzz.outputs.status == '0' || steps.fuzz.outputs.status == '1'
        shell: bash
        run: |
          rm -rf fuzz-corpus-cache
          if [[ -d fuzz-work/corpus-min ]]; then
            cp -r fuzz-work/corpus-min fuzz-corpus-cache
          else
            cp -r fuzz-work/corpus fuzz-corpus-cache
          fi
          echo "caching $(find fuzz-corpus-cache -type f | wc -l) corpus inputs"
      - name: Save fuzzing corpus
        if: steps.fuzz.outputs.status == '0' || steps.fuzz.outputs.status == '1'
        uses: actions/cache/save@v4
        with:
          path: fuzz-corpus-cache
          key: fuzz-corpus-${{ github.run_id }}-${{ matrix.variant }}
      - name: Upload findings
        if: steps.fuzz.outputs.status == '1'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-weekly-findings-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            fuzz-work/findings
            fuzz-work/summary.md
          if-no-files-found: error
          retention-days: 90
      - name: Upload fuzzing log
        if: always() && steps.fuzz.outputs.status != ''
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-weekly-log-${{ matrix.variant }}-${{ github.run_id }}
          path: fuzz-work/fuzz.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail the job if the fuzzer found a regression
        if: steps.fuzz.outputs.status == '1'
        run: exit 1

  # Files one GitHub issue per distinct finding across all variants. A separate
  # job (rather than a step per variant) so two variants hitting the same bug
  # cannot race each other into filing duplicates.
  report:
    needs: fuzz
    if: always()
    runs-on: ubuntu-24.04
    name: File issues for findings
    steps:
      - name: Download findings
        # No variant having findings (the normal case) is not an error.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: fuzz-weekly-findings-*-${{ github.run_id }}
          path: findings
      - name: File or update a GitHub issue per finding
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // findings/fuzz-weekly-findings-<variant>-<run>/findings/<n>/{signature,count,input,minimized,report.txt}
            const bySignature = new Map();
            if (fs.existsSync('findings')) {
              // The plain variant first, so its reproducer (which the repro
              // instructions below build for) is the one quoted.
              const artifacts = fs.readdirSync('findings').sort((a, b) =>
                (b.includes('-plain-') - a.includes('-plain-')) || a.localeCompare(b));
              for (const artifact of artifacts) {
                const variant = artifact.replace(/^fuzz-weekly-findings-/, '').replace(/-\d+$/, '');
                const root = path.join('findings', artifact, 'findings');
                if (!fs.existsSync(root)) continue;
                for (const id of fs.readdirSync(root)) {
                  const dir = path.join(root, id);
                  const read = (f) => fs.existsSync(path.join(dir, f)) ? fs.readFileSync(path.join(dir, f), 'utf8') : '';
                  const signature = read('signature').trim();
                  if (!signature) continue;
                  const entry = bySignature.get(signature) || { variants: [], count: 0, report: '', reproducer: '' };
                  entry.variants.push(variant);
                  entry.count += parseInt(read('count'), 10) || 1;
                  if (!entry.report) {
                    const report = read('report.txt');
                    // The harness report alone when there is one (the abort()
                    // stack libFuzzer prints after it is noise), else the tail of
                    // the sanitizer/libFuzzer output.
                    const start = report.lastIndexOf('==== Nautilus differential fuzzer');
                    const end = start >= 0 ? report.indexOf('\n=====', start + 1) : -1;
                    entry.report = (start < 0 ? report.slice(-4000)
                      : report.slice(start, end >= 0 ? report.indexOf('\n', end + 1) : undefined)).slice(0, 6000).trim();
                    const file = fs.existsSync(path.join(dir, 'minimized')) ? 'minimized' : 'input';
                    entry.reproducer = `fuzz-weekly-findings-${variant}-${context.runId}: findings/${id}/${file}`;
                  }
                  bySignature.set(signature, entry);
                }
              }
            }
            if (bySignature.size === 0) {
              core.info('No findings to report.');
              return;
            }

            const label = 'fuzzer-finding';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });

            for (const [signature, entry] of bySignature) {
              const title = `[fuzzer] ${signature}`.slice(0, 250);
              const variants = [...new Set(entry.variants)].join(', ');
              const existing = openIssues.find((issue) => issue.title === title);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Seen again in the [weekly fuzz run](${runUrl}) on ${new Date().toISOString().slice(0, 10)} ` +
                    `(${entry.count} occurrence(s); variants: ${variants}).`,
                });
                continue;
              }
              const sanitizerFlag = entry.variants.includes('plain') ? ''
                : entry.variants.includes('asan') ? ' -DENABLE_ADDRESS_SANITIZER=ON' : ' -DENABLE_UB_SANITIZER=ON';
              const body = [
                'The weekly coverage-guided fuzz sweep (`nautilus-fuzz`, see `nautilus/test/fuzz/README.md`) found a backend disagreement or crash.',
                '',
                `- Run: ${runUrl}`,
                `- Signature: \`${signature}\``,
                `- Build variants: ${variants}`,
                `- Occurrences: ${entry.count}`,
                `- Reproducer: \`${entry.reproducer}\` (download the artifact from the run)`,
                '',
                '### Finding report',
                '```',
                entry.report,
                '```',
                '',
                'To reproduce locally:',
                '```bash',
                `cmake -DENABLE_FUZZING=ON${sanitizerFlag} -DCMAKE_CXX_COMPILER=clang++-21 -DCMAKE_BUILD_TYPE=RelWithDebInfo ..`,
                'cmake --build . --target nautilus-fuzz',
                './nautilus/test/fuzz/nautilus-fuzz <reproducer-file>',
                '```',
                'See "Reproducing and pinning a finding" in `nautilus/test/fuzz/README.md` for turning it into a permanent regression test.',
              ].join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label, 'bug'],
              });
            }
