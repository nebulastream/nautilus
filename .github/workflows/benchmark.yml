name: Benchmark
on:
  push:
    branches:
      - main
      - nautilus-0.4
  # Pull requests against main or nautilus-0.4, and any pull request with the `0.4` label (a stacked 0.4 PR).
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# cancel previous runs of same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  benchmark:
    name: Run tracing benchmark
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' || ((github.event.action != 'labeled' || github.event.label.name == '0.4') && (github.base_ref == 'main' || github.base_ref == 'nautilus-0.4' || contains(github.event.pull_request.labels.*.name, '0.4'))) }}
    env:
      # clang >= 19 so the tbc copy-and-patch JIT benchmarks
      # (exec_tbc_*_{interp,jit}) are runnable; they are skipped on builds
      # that cannot execute stitched code (preserve_none needs Clang 19+).
      CC: clang-21
      CXX: clang++-21
    steps:
      - uses: actions/checkout@v4
      - name: Force apt to use IPv4
        run: echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
      - name: get cmake
        uses: lukka/get-cmake@latest
      - name: Install clang from LLVM apt repo
        run: |
          UBUNTU_CODENAME=$(lsb_release -cs)
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/${UBUNTU_CODENAME}/ llvm-toolchain-${UBUNTU_CODENAME}-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21 clang++-21
      - name: Install ccache (with retry)
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y ccache && exit 0
            echo "apt-get install ccache failed (attempt $i/5), retrying in 15s..."
            sleep 15
          done
          exit 1
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          key: ${{ github.job }}-ubuntu-24.04-clang-21-benchmark
      - name: cmake
        shell: bash
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache -DENABLE_BENCHMARKS=ON -DENABLE_LOGGING=OFF -G Ninja -S .
      - name: build
        shell: bash
        run: |
          cmake --build . --target all
      - name: test
        shell: bash
        run: |
          ./nautilus/test/benchmark/nautilus-benchmarks | tee benchmark_result.txt
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1.20.7
        with:
          name: Tracing Benchmark
          tool: 'catch2'
          output-file-path: benchmark_result.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # nautilus-0.4 keeps its own history, so its ratios are never taken against main's numbers (and main keeps
          # the default path with its existing history).
          benchmark-data-dir-path: ${{ (github.base_ref == 'nautilus-0.4' || github.ref == 'refs/heads/nautilus-0.4' || contains(github.event.pull_request.labels.*.name, '0.4')) && 'dev/bench-0.4' || 'dev/bench' }}
          auto-push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nautilus-0.4') }}
          comment-always: true
          save-data-file: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nautilus-0.4') }}
          gh-pages-branch: 'pages'
          max-items-in-chart: 200
