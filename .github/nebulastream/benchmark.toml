# Benchmark of NebulaStream's systests against this nautilus, run by nes-bench.py.
#
# Every query runs on its own, as a fresh `systest -b` process, once per
# configuration and round. A configuration is a set of nautilus options that
# nes-bench.py passes in NAUTILUS_OPTIONS, layered over the options NebulaStream
# sets itself, so every configuration runs the same NebulaStream build.

[run]
# Rounds per query and configuration; compilation is reported as the median
# round, execution as the best.
rounds = 5
# NebulaStream runs on a single node: on two nodes a query's execution includes
# the channel registration backoff between them. One worker thread keeps idle
# threads from adding ~30 ms jumps.
worker_threads = 1

# NebulaStream's own choice: MLIR, machine code generated on the first call.
[[configuration]]
name = "mlir"
options = { "engine.backend" = "mlir" }
suite = true

# MLIR with machine code generated during compilation.
[[configuration]]
name = "mlir-eager"
options = { "engine.backend" = "mlir", "mlir.eager_compilation" = true }

[[configuration]]
name = "asmjit"
options = { "engine.backend" = "asmjit" }
suite = true

# The bytecode interpreter does not support every type NebulaStream's
# aggregations and joins use yet; its failures are warnings, not errors.
[[configuration]]
name = "bc"
options = { "engine.backend" = "bc" }
optional = true

[[configuration]]
name = "tbc"
options = { "engine.backend" = "tbc" }
suite = true

[[configuration]]
name = "tbc-jit"
options = { "engine.backend" = "tbc", "tbc.mode" = "jit" }

[[configuration]]
name = "cpp"
options = { "engine.backend" = "cpp" }
suite = true

# Tiered: AsmJit code right away, MLIR code promoted in the background. The
# empty engine.backend clears NebulaStream's single-backend choice.
[[configuration]]
name = "tiered-asmjit-mlir"
options = { "engine.backend" = "", "engine.tier0.backend" = "asmjit", "engine.tier1.backend" = "mlir" }

